<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TechStack Insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <style>
    @media (max-width: 820px) {
      .tabs-desktop { display: none !important; }
      .mobile-menu  { display: flex !important; }
      .mobile-nav   { display: flex !important; }
      .live-pill    { display: none !important; }
      .logo-sub     { display: none !important; }
    }
    @media (max-width: 1100px) {
      .tabs-desktop button { padding: 8px 12px !important; font-size: 12px !important; }
    }
    @media (max-width: 600px) {
      header > div:first-child { padding: 10px 14px !important; }
      main { padding: 14px !important; }
    }
    #boot-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg-0);color:var(--text-2);transition:opacity .35s}
    #boot-loader.gone{opacity:0;pointer-events:none}
    #boot-loader .ring{width:38px;height:38px;border:3px solid var(--bg-3);border-top-color:var(--brand);border-right-color:var(--brand-2);border-radius:99px;animation:spin .8s linear infinite}
    #boot-loader .msg{font-size:13px;font-weight:600;color:var(--text-1)}
    #boot-loader .sub{font-size:11px;color:var(--text-3)}
  </style>
</head>
<body>
  <div id="boot-loader">
    <div class="ring"></div>
    <div class="msg">실시간 채용공고 분석 중…</div>
    <div class="sub">Supabase에서 데이터 가져오는 중</div>
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="data.js?v=4"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="layout.jsx"></script>
  <script type="text/babel" src="section-dashboard.jsx"></script>
  <script type="text/babel" src="section-match.jsx"></script>
  <script type="text/babel" src="section-ai.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel" data-presets="env,react">
    // Wait for the data fetch (or its mock fallback) before mounting React.
    // Babel/standalone evaluates this script after all jsx files have been
    // transformed and registered, so App/Header/etc are guaranteed to exist
    // by the time we call createRoot. window.TSI_DATA is also guaranteed to
    // be set because TSI_LOAD resolves with a mock stub on failure.
    (function () {
      function mount() {
        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
        requestAnimationFrame(function () {
          var bl = document.getElementById("boot-loader");
          if (bl) {
            bl.classList.add("gone");
            setTimeout(function () { bl.remove(); }, 400);
          }
          if (typeof setupReveal === "function") setupReveal();
        });
      }

      if (typeof window.TSI_LOAD !== "function") {
        // data.js failed to load entirely — show error state instead of blanking out.
        window.TSI_DATA = window.TSI_DATA || {
          UPDATED: "—", TOTAL_JOBS: 0, TOTAL_SKILLS: 0, TOTAL_AI_TOOLS: 0,
          SKILLS_TOP10: [], CATEGORY_DIST: [],
          EXP_DIST: [
            { label: "신입", value: 0 }, { label: "1–3년", value: 0 },
            { label: "3–5년", value: 0 }, { label: "5–10년", value: 0 }, { label: "10년+", value: 0 },
          ],
          RECENT_TRENDS: [],
          AI_TOOLS: [], AI_CATEGORY: [], AI_BY_ROLE: [], AI_REQ_PREF: [],
          RECOMMEND_ROLES: [], RECOMMEND_JOBS: [],
        };
        mount();
        return;
      }

      window.TSI_LOAD().then(function (data) {
        window.TSI_DATA = data;
        mount();
      });
    })();
  </script>
</body>
</html>
